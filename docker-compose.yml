version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: smarthome_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: smarthome_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  fastapi:
    build: .
    container_name: smarthome_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - mosquitto
    volumes:
      - .:/code

volumes:
  postgres_data:
  mongo_data:
